name: Build

# Builds installers on real Windows and macOS machines. Run it from the
# Actions tab (or on any push) and download the result from the run's
# Artifacts section - no local toolchain required.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check
      # Only the parts that do not need the Tauri system libraries, so this
      # job stays fast and does not pull in GTK/WebKit on Linux.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --no-deps -- -D warnings
        continue-on-error: true

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: rustc --version && cargo --version
      # --nocapture so the real device enumeration prints what this OS sees.
      # That is the only place CI can show whether the Windows loopback path
      # actually surfaces output devices.
      - name: Run tests
        working-directory: src-tauri
        run: cargo test -- --nocapture

  build:
    name: Installer (${{ matrix.os }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: verity-windows
            paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest
            artifact: verity-macos
            paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@v4

      # Cache the dependency build, which dominates a cold run.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2"

      - name: Build installer
        working-directory: src-tauri
        run: cargo tauri build

      - name: List what was bundled
        shell: bash
        run: ls -R src-tauri/target/release/bundle

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
